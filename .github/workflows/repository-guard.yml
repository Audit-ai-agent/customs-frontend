name: repository-guard

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:quick
      - run: npm run check:contract
      - run: npm run build
      - name: Detect optional dependency and container checks
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            files=$'package-lock.json\nDockerfile'
          else
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            files="$(git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}")"
          fi
          if grep -Eq '^(package\.json|package-lock\.json)$' <<<"${files}"; then
            echo "dependency=true" >> "${GITHUB_OUTPUT}"
          else
            echo "dependency=false" >> "${GITHUB_OUTPUT}"
          fi
          if grep -Eq '^(Dockerfile|deploy/)' <<<"${files}"; then
            echo "container=true" >> "${GITHUB_OUTPUT}"
          else
            echo "container=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Audit changed dependency lock
        if: steps.changes.outputs.dependency == 'true'
        run: npm run security:audit
      - name: Check changed container definition builds
        if: steps.changes.outputs.container == 'true'
        shell: bash
        run: docker build --tag "customs-frontend:${GITHUB_SHA}" .
