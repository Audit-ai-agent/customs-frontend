name: repository-guard

on:
  pull_request:
    paths:
      - ".github/workflows/repository-guard.yml"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "playwright.config.ts"
      - "tsconfig.json"
      - "vite.config.ts"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "e2e/**"
      - "contracts/**"
      - "deploy/uat/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/repository-guard.yml"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "playwright.config.ts"
      - "tsconfig.json"
      - "vite.config.ts"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "e2e/**"
      - "contracts/**"
      - "deploy/uat/**"

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:quick
      - run: npm run check:contract
      - run: npm run build
      - name: Detect dependency lock changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            files='package-lock.json'
          elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            files='package-lock.json'
          else
            files="$(git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}")"
          fi
          if grep -Eq '^(package\.json|package-lock\.json)$' <<<"${files}"; then
            echo "dependency=true" >> "${GITHUB_OUTPUT}"
          else
            echo "dependency=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Audit changed dependency lock
        if: steps.changes.outputs.dependency == 'true'
        run: npm run security:audit
