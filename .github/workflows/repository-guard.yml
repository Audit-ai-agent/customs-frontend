name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/repository-guard.yml"
      - ".gitleaks.toml"
      - ".gitignore"
      - ".npmrc"
      - "README.md"
      - "ARCHITECTURE.md"
      - "CONTRIBUTING.md"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "tsconfig.json"
      - "vite.config.ts"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "contracts/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/repository-guard.yml"
      - ".gitleaks.toml"
      - ".gitignore"
      - ".npmrc"
      - "README.md"
      - "ARCHITECTURE.md"
      - "CONTRIBUTING.md"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "tsconfig.json"
      - "vite.config.ts"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "contracts/**"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: corepack enable
      - run: npm ci --no-audit --no-fund
      - run: npm run check:quick
      - run: npm run check:contract
      - run: git diff --check HEAD^ HEAD
      - name: Scan tracked source with redacted Gitleaks output
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status -
          tar -xzf "$archive" gitleaks
          scan_root="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$scan_root"
          ./gitleaks dir "$scan_root" --config .gitleaks.toml --redact --no-banner --exit-code 1
